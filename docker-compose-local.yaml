
networks:
  ticketz:

volumes:
  postgres_data:
  redis_data:
  backend_public:

services:
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile

    volumes:
      - backend_public:/usr/src/app/public

    env_file:
      - .env-backend-local

    environment:
      DB_PASS: ${WHATICKET_DB_PASSWORD}

    restart: always

    depends_on:
      - postgres
      - redis

    expose:
      - "3000"

    networks:
      - ticketz

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile

    env_file:
      - .env-frontend-local

    restart: always

    depends_on:
      - backend

    expose:
      - "80"

    networks:
      - ticketz

  postgres:
    image: postgres:16-alpine

    volumes:
      - postgres_data:/var/lib/postgresql/data

    environment:
      POSTGRES_USER: ticketz
      POSTGRES_DB: ticketz
      POSTGRES_PASSWORD: ${WHATICKET_DB_PASSWORD}
      TZ: America/Fortaleza

    expose:
      - "5432"

    restart: always

    networks:
      - ticketz

  redis:
    image: redis:alpine

    command: redis-server --appendonly yes

    expose:
      - "6379"

    restart: always

    volumes:
      - redis_data:/data

    networks:
      - ticketz
